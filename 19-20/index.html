<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина интернет-магазина</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="catalog">
        <h2>Каталог товаров</h2>
        <div class="product" data-name="Товар 1" data-price="10">
            <h3>Товар 1</h3>
            <p>Цена: $10</p>
            <button class="add-to-cart">Добавить в корзину</button>
        </div>
        <div class="product" data-name="Товар 2" data-price="20">
            <h3>Товар 2</h3>
            <p>Цена: $20</p>
            <button class="add-to-cart">Добавить в корзину</button>
        </div>
    </div>

    <div class="cart">
        <h2>Корзина</h2>
        <ul class="cart-items"></ul>
        <div class="cart-total">Итого: $<span class="total">0</span></div>
        <button class="clear-cart">Очистить корзину</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
